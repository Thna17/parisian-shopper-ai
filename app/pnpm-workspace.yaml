packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    - GHSA-f88m-g3jw-g9cj
    - GHSA-rgj7-g3m4-5g8c
    - GHSA-wq5f-xc86-pv6w

overrides:
  deepmerge-ts: 8.0.0
