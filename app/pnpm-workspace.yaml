packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    - GHSA-f88m-g3jw-g9cj
    - GHSA-rgj7-g3m4-5g8c
    - GHSA-wq5f-xc86-pv6w

overrides:
  deepmerge-ts: 8.0.0
  undici: '>=8.12.2'
  qs: '>=6.16.1'
  ip-address: '>=10.7.4'
  body-parser: '>=2.4.0'
  zod: '>=4.6.6'
  multer: '>=2.5.0'
  follow-redirects: '>=1.16.2'
