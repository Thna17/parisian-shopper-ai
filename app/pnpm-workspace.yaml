packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

overrides:
  deepmerge-ts: 8.0.0
