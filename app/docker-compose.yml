name: parisian-shopper-ai

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in app/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in app/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in app/.env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  valkey:
    image: valkey/valkey:8.1.3-alpine
    restart: unless-stopped
    # Local-only Compose binds the published port to loopback. Shared deployments
    # must use authenticated Valkey and a private network instead of this profile.
    command: ['valkey-server', '--appendonly', 'yes', '--protected-mode', 'no']
    ports:
      - '127.0.0.1:${VALKEY_PUBLISHED_PORT:-6379}:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  valkey_data:
